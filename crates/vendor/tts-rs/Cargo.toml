[package]
name = "tts-rs"
version = "2026.2.3"
edition = "2021"
description = "Vendored Kokoro TTS (patched for ort 2.0.0-rc.12)"
license = "MIT"
publish = false

[features]
default = []
kokoro = ["dep:ort", "dep:ndarray", "dep:zip"]

[dependencies]
derive_builder = "0.20.2"
env_logger = "0.10.0"
hound = "3.5.1"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ndarray = { version = "0.17", optional = true }
ort = { version = "2.0.0-rc.12", optional = true, default-features = true, features = ["ndarray"] }
zip = { version = "2", optional = true, default-features = false, features = ["deflate"] }
